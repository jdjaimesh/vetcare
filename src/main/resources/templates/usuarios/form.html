<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'"></h1>
    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input class="form-control" th:field="*{username}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña
                <small class="text-muted" th:if="${usuario.id != null}">(déjala vacía para no cambiarla)</small>
            </label>
            <input class="form-control" type="password" name="password" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" th:field="*{rol}" th:errorclass="is-invalid" id="rol">
                <option value="">-- Selecciona --</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{rol}"></div>
        </div>
        <div class="mb-3" id="bloquePropietario">
            <label class="form-label">Propietario asociado (solo rol Propietario)</label>
            <select class="form-select" name="propietario.id"
                    th:classappend="${#fields.hasErrors('propietario')} ? 'is-invalid'">
                <option value="">-- Selecciona --</option>
                <option th:each="p : ${propietarios}" th:value="${p.id}"
                        th:text="${p.nombre} + ' (' + ${p.documento} + ')'"
                        th:selected="${usuario.propietario != null and usuario.propietario.id == p.id}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{propietario}"></div>
        </div>
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
            <label class="form-check-label" for="activo">Usuario activo</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
        </div>
    </form>
</div>
<script>
    const rol = document.getElementById('rol');
    const bloque = document.getElementById('bloquePropietario');
    function actualizar() { bloque.style.display = rol.value === 'PROPIETARIO' ? 'block' : 'none'; }
    rol.addEventListener('change', actualizar);
    actualizar();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
