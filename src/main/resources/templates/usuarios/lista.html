<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">+ Nuevo usuario</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Propietario asociado</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.nombre}"></td>
                <td><span class="badge text-bg-secondary" th:text="${u.rol.etiqueta}"></span></td>
                <td th:text="${u.propietario != null} ? ${u.propietario.nombre} : '—'"></td>
                <td>
                    <span class="badge text-bg-success" th:if="${u.activo}">Activo</span>
                    <span class="badge text-bg-danger" th:unless="${u.activo}">Inactivo</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este usuario?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
