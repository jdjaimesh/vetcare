<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Propietario')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="${propietario.id == null} ? 'Nuevo propietario' : 'Editar propietario'"></h1>
    <form th:action="@{/propietarios/guardar}" th:object="${propietario}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Documento</label>
                <input class="form-control" th:field="*{documento}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{documento}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Teléfono</label>
                <input class="form-control" th:field="*{telefono}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{telefono}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input class="form-control" type="email" th:field="*{correo}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{correo}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input class="form-control" th:field="*{direccion}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{direccion}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/propietarios}">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
