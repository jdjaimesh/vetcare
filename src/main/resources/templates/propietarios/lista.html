<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Propietarios')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Propietarios</h1>
        <a class="btn btn-primary" th:href="@{/propietarios/nuevo}">+ Nuevo propietario</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <form class="row g-2 mb-3" th:action="@{/propietarios}" method="get">
        <div class="col-sm-6 col-md-4">
            <input class="form-control" name="q" th:value="${q}" placeholder="Buscar por nombre o documento">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
            <a class="btn btn-link" th:href="@{/propietarios}">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${propietarios}">
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.documento}"></td>
                <td th:text="${p.telefono}"></td>
                <td th:text="${p.correo}"></td>
                <td th:text="${p.direccion}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/mascotas(propietarioId=${p.id})}">Mascotas</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/propietarios/editar/{id}(id=${p.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/propietarios/eliminar/{id}(id=${p.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este propietario?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(propietarios)}"><td colspan="6" class="text-center text-muted">Sin resultados</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
