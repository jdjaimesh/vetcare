<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mascota')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="${mascota.id == null} ? 'Nueva mascota' : 'Editar mascota'"></h1>
    <form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Propietario</label>
            <select class="form-select" name="propietario.id"
                    th:classappend="${#fields.hasErrors('propietario')} ? 'is-invalid'">
                <option value="">-- Selecciona --</option>
                <option th:each="p : ${propietarios}" th:value="${p.id}"
                        th:text="${p.nombre} + ' (' + ${p.documento} + ')'"
                        th:selected="${mascota.propietario != null and mascota.propietario.id == p.id}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{propietario}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Especie</label>
                <select class="form-select" th:field="*{especie}" th:errorclass="is-invalid">
                    <option value="">-- Selecciona --</option>
                    <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{especie}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Raza</label>
                <input class="form-control" th:field="*{raza}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{raza}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Sexo</label>
                <select class="form-select" th:field="*{sexo}" th:errorclass="is-invalid">
                    <option value="">-- Selecciona --</option>
                    <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{sexo}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input class="form-control" type="date" th:field="*{fechaNacimiento}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Peso (kg)</label>
                <input class="form-control" type="number" step="0.1" th:field="*{peso}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{peso}"></div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/mascotas}">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
