<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mascotas')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Mascotas</h1>
        <a class="btn btn-primary" th:href="@{/mascotas/nueva}" sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')">+ Nueva mascota</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
            <tr><th>Nombre</th><th>Especie</th><th>Raza</th><th>Sexo</th><th>Edad</th><th>Peso (kg)</th><th>Propietario</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${mascotas}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.especie}"></td>
                <td th:text="${m.raza}"></td>
                <td th:text="${m.sexo}"></td>
                <td th:text="${m.edad}"></td>
                <td th:text="${m.peso}"></td>
                <td th:text="${m.propietario.nombre}"></td>
                <td class="text-end text-nowrap">
                    <span sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/mascotas/editar/{id}(id=${m.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/mascotas/eliminar/{id}(id=${m.id})}" method="post"
                              onsubmit="return confirm('¿Eliminar esta mascota?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(mascotas)}"><td colspan="8" class="text-center text-muted">No hay mascotas registradas</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
