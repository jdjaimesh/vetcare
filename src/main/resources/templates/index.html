<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <h1 class="h3 mb-1">Bienvenido, <span sec:authentication="name"></span></h1>
    <p class="text-muted">Gestión inteligente de clínica veterinaria · Sprint 1</p>

    <div class="row g-3 mt-2" sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA','VETERINARIO')">
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card text-center"><div class="card-body">
                <div class="display-6" th:text="${totalUsuarios}">0</div>
                <div class="text-muted">Usuarios</div>
                <a class="stretched-link" th:href="@{/usuarios}"></a>
            </div></div>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')">
            <div class="card text-center"><div class="card-body">
                <div class="display-6" th:text="${totalPropietarios}">0</div>
                <div class="text-muted">Propietarios</div>
                <a class="stretched-link" th:href="@{/propietarios}"></a>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card text-center"><div class="card-body">
                <div class="display-6" th:text="${totalMascotas}">0</div>
                <div class="text-muted">Mascotas</div>
                <a class="stretched-link" th:href="@{/mascotas}"></a>
            </div></div>
        </div>
    </div>

    <div sec:authorize="hasAnyRole('PROPIETARIO')">
        <a class="btn btn-primary" th:href="@{/mascotas}">Ver mis mascotas</a>
    </div>
    <div class="alert alert-info mt-3" sec:authorize="hasRole('AUXILIAR')">
        El módulo de inventario estará disponible en el Sprint 2.
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
