spring.application.name=vetcare
server.port=${PORT:8080}

# Base de datos MySQL online (Aiven, Railway, FreeSQLDatabase, etc.).
# Las credenciales llegan por variables de entorno: NUNCA se suben al repositorio.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vetcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
